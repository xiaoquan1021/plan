    old_source: plans/2026-06-11-xq-lightweight-dependency-refactor-from-XQ-main-zip.md
    new_task_ids: [PR-M0-001]
    new_milestone: PR-M0
    new_epic: PR-M0-CONTRACT-KERNEL
    status_rule: historical-only
    superseded_by: docs/contracts/product-scope-v1.md
    reason: Main narrative plan is superseded by contract kernel sources.
  - old_task_id: execution-entry
    old_source: plans/xq-integrated-rebuild/00-execution-entry.md
    new_task_ids: [PR-M2-001]
    new_milestone: PR-M2
    new_epic: PR-M2-LEDGER-PROJECTION
    status_rule: superseded
    superseded_by: ledger/task-definitions/index.yaml
    reason: Execution entry is now derived from task definitions and projections.
  - old_task_id: readme
    old_source: plans/xq-integrated-rebuild/README.md
    new_task_ids: [PR-M0-001]
    new_milestone: PR-M0
    new_epic: PR-M0-CONTRACT-KERNEL
