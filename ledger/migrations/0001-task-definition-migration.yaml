schema_version: 1
migration_id: 0001-task-definition-migration
description: Map the historical public snapshot from 59bf3d2 into the PR/XQ task-definition model without inheriting implementation completion.
legacy_input: ledger/archive/legacy-public-snapshot-202606/tasks.json
rules:
